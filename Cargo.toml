[workspace]
members = [
	"libs/*",
	"themes/current",
	"app"
]
resolver = "3"

[workspace.dependencies]
# Core:
serde = { version = "1.0.219", features = ["derive"] }
anyhow = "1.0.98"
libc = { version = "0.2.174" }
cluConstData = { version = "2.1.2", default-features = false, features = ["clufulltransmute"] }
include_tt = "1.0.6"